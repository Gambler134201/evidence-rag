[alembic]
script_location = migrations
prepend_sys_path = .
# Connection URL is NOT stored here (nothing secret in git): env.py resolves it
# from evidence_rag.config (repo-root .env). Tests override it via conftest
# using sqlalchemy.url pointing at the dedicated evidence_rag_test database.
# NOTE: keep this file ASCII-only; Windows configparser decodes it as GBK.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
